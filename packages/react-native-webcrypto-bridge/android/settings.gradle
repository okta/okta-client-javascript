pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            // Apply versions only for standalone builds, not in composite builds
            if (gradle.parent == null) {
                if (requested.id.id == 'com.android.library') {
                    useVersion('8.1.0')
                } else if (requested.id.id == 'org.jetbrains.kotlin.android') {
                    useVersion('2.1.0')
                }
            }
        }
    }
}

includeBuild('../../../node_modules/@react-native/gradle-plugin')

rootProject.name = 'okta-react-native-webcrypto-bridge'
